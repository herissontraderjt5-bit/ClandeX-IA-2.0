<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#083344" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="neonRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Fundo Dark Hexagonal / Rounded -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)" stroke="#0e7490" stroke-width="6" />
  
  <!-- Círculos de Radar / Grid Tecnológico -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#164e63" stroke-width="2" stroke-dasharray="6,6" opacity="0.6" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#0891b2" stroke-width="1.5" opacity="0.4" />
  
  <!-- Velas Candlestick estilizadas no centro -->
  <!-- Vela 1 (Verde Alta) -->
  <line x1="180" y1="140" x2="180" y2="370" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
  <rect x="160" y="200" width="40" height="130" rx="8" fill="url(#neonGreen)" filter="url(#neonGlow)" />
  
  <!-- Vela 2 (Ciano Central / IA) -->
  <line x1="256" y1="100" x2="256" y2="410" stroke="#06b6d4" stroke-width="8" stroke-linecap="round" />
  <rect x="232" y="160" width="48" height="180" rx="10" fill="url(#neonCyan)" filter="url(#neonGlow)" />
  
  <!-- Vela 3 (Rosa / Retração) -->
  <line x1="332" y1="170" x2="332" y2="340" stroke="#f43f5e" stroke-width="6" stroke-linecap="round" />
  <rect x="312" y="210" width="40" height="90" rx="8" fill="url(#neonRose)" filter="url(#neonGlow)" />

  <!-- Símbolo de IA / Pulso Elétrico -->
  <path d="M120 256 L190 256 L220 200 L256 310 L290 220 L320 256 L392 256" fill="none" stroke="#67e8f9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" />
  
  <!-- Logo Text / Badge -->
  <rect x="136" y="390" width="240" height="48" rx="24" fill="#030712" stroke="#22d3ee" stroke-width="3" />
  <text x="256" y="422" fill="#22d3ee" font-family="'JetBrains Mono', 'Plus Jakarta Sans', monospace, sans-serif" font-weight="900" font-size="24" text-anchor="middle" letter-spacing="3">CLANDEX-IA</text>
</svg>

